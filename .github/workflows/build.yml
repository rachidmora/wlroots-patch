name: Build patched wlroots

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-24.04-arm

    container: debian:trixie

    steps:

      - uses: actions/checkout@v4

      - run: bash build.sh

      - uses: actions/upload-artifact@v4

        with:

          name: wlroots-debs

          path: out/*.deb
